<meta charset="utf-8">
<title>Katinka — Séance 3 — Le silence te va bien</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#14213D; --navy2:#1B2A4A; --gold:#C9A961; --gold2:#E3C782;
  --ink:#F4F1EA; --dim:#9BA6BC; --green:#4ECDA4; --red:#FF6B6B; --plum:#B98CD8;
}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,#1E3157 0%,var(--navy) 55%,#0D1729 100%);
  color:var(--ink); font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;
  overflow:hidden;
}
#stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:66px 56px 112px}
.screen{display:none;width:100%;max-width:1180px;text-align:center}
.screen.on{display:block;animation:in .5s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.kicker{font-size:19px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:22px;font-weight:700}
h1{font-size:72px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:52px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
.sub{font-size:28px;color:var(--dim);margin-top:20px;line-height:1.45}
.en{font-size:22px;color:#7F8CA6;font-style:italic;margin-top:14px}
.gold{color:var(--gold2)}

#logo{position:fixed;top:20px;left:26px;height:48px;opacity:.95;z-index:9;background:#fff;padding:5px 9px;border-radius:8px}
#nav{position:fixed;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:20px;z-index:9}
.dot{width:9px;height:9px;border-radius:50%;background:#3A4B6E;transition:.3s;cursor:pointer}
.dot.on{background:var(--gold);transform:scale(1.5)}
#hint{position:fixed;bottom:52px;left:0;right:0;text-align:center;font-size:15px;color:#5E6C88;letter-spacing:.1em}

.btn{display:inline-block;margin:12px 9px;padding:18px 38px;border-radius:16px;border:2px solid var(--gold);
  background:transparent;color:var(--gold2);font-size:24px;font-weight:700;cursor:pointer;transition:.22s;font-family:inherit}
.btn:hover{background:var(--gold);color:var(--navy);transform:translateY(-3px)}
.btn.solid{background:var(--gold);color:var(--navy)}
.btn.solid:hover{background:var(--gold2)}
.btn.small{font-size:19px;padding:12px 24px;margin:8px 5px}

.timer{font-size:130px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.timer.run{color:var(--green)}
.timer.warn{color:var(--gold2)}
.timer.end{color:var(--red);animation:shake .5s}
.timer.wait{color:#5E6C88}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-11px)}75%{transform:translateX(11px)}}
.ring{width:100%;height:12px;background:#22345A;border-radius:99px;overflow:hidden;margin:26px auto 0;max-width:760px}
.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:100%;transition:width .25s linear}

.grid{display:grid;gap:20px;margin-top:34px}
.g2{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:rgba(255,255,255,.05);border:2px solid rgba(201,169,97,.28);border-radius:20px;
  padding:30px 18px;cursor:pointer;transition:.28s;min-height:145px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.card:hover{border-color:var(--gold);transform:translateY(-5px)}
.card .fr{font-size:36px;font-weight:800;color:var(--gold2);line-height:1.15}
.card .tr{font-size:19px;color:var(--dim);margin-top:12px;opacity:0;transition:.35s;font-style:italic}
.card.open{background:rgba(201,169,97,.16);border-color:var(--gold)}
.card.open .tr{opacity:1}
.card.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.card.big .fr{font-size:46px}
.card.big .tr{font-size:22px}

.rule{background:rgba(255,107,107,.1);border:2px solid rgba(255,107,107,.45);border-radius:20px;
  padding:26px 30px;margin-top:18px;text-align:left}
.rule .h{font-size:30px;font-weight:800;color:var(--red);margin-bottom:10px}
.rule .b{font-size:22px;color:var(--ink);line-height:1.45}
.rule.ok{background:rgba(78,205,164,.1);border-color:rgba(78,205,164,.45)}
.rule.ok .h{color:var(--green)}

.pill{display:inline-block;padding:12px 26px;border-radius:99px;background:rgba(201,169,97,.16);
  border:2px solid rgba(201,169,97,.4);font-size:25px;font-weight:700;color:var(--gold2);margin:8px}

.qbox{font-size:52px;font-weight:800;line-height:1.2;min-height:130px;display:flex;align-items:center;justify-content:center}
.count{font-size:21px;color:var(--dim);letter-spacing:.2em;margin-bottom:22px}
.slot{font-size:54px;font-weight:800;color:var(--gold2);min-height:72px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.slot.roll{animation:roll .09s linear infinite}
@keyframes roll{0%{opacity:.35;transform:translateY(-8px)}100%{opacity:1;transform:none}}
.tag{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);font-weight:700;margin-bottom:16px}

.stat{display:flex;align-items:center;justify-content:space-between;gap:24px;
  background:rgba(255,255,255,.05);border-radius:18px;padding:22px 30px;margin-top:14px;text-align:left}
.stat .lab{font-size:25px;color:var(--ink)}
.stat .val{font-size:48px;font-weight:800;white-space:nowrap}
.stat.good{border-left:6px solid var(--green)}
.stat.good .val{color:var(--green)}
.stat.gold{border-left:6px solid var(--gold)}
.stat.gold .val{color:var(--gold2)}

.drillbox{background:rgba(255,255,255,.05);border:2px solid rgba(185,140,216,.4);border-radius:22px;padding:16px 26px;margin-top:12px}
.drillbox .lbl{font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);font-weight:700;margin-bottom:10px}

.board{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;flex-wrap:wrap}
.cellb{width:48px;height:48px;border-radius:11px;border:2px solid #3A4B6E;background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;cursor:pointer;transition:.18s;color:#5E6C88}
.cellb:hover{border-color:var(--gold)}
.cellb.ok{border-color:var(--green);background:rgba(78,205,164,.18);color:var(--green)}
.cellb.no{border-color:var(--red);background:rgba(255,107,107,.15);color:var(--red)}
.tally{font-size:29px;font-weight:800;color:var(--gold2);margin-top:9px;font-variant-numeric:tabular-nums}
.mini{font-size:15px;color:#5E6C88;margin-top:5px;letter-spacing:.05em}
.excol{background:rgba(255,255,255,.05);border:2px solid rgba(201,169,97,.32);border-radius:22px;
  padding:18px 22px 16px;display:flex;flex-direction:column;align-items:center}
.exhead{font-size:40px;font-weight:800;color:var(--gold2);line-height:1.1}
.exgloss{font-size:19px;color:var(--dim);font-style:italic;margin-top:8px}
.exlist{width:100%;margin-top:14px;min-height:150px}
.exline{background:rgba(201,169,97,.10);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;
  padding:10px 15px;margin-bottom:9px;text-align:left;cursor:pointer;transition:.2s;
  animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.exline:hover{background:rgba(201,169,97,.18)}
.exline .fr2{font-size:22px;font-weight:700;color:var(--ink);line-height:1.28}
.exline .tr2{font-size:18px;color:#8D9AB4;font-style:italic;margin-top:7px;display:none}
.exline.open .tr2{display:block}
.exline .hintx{font-size:14px;color:#5E6C88;letter-spacing:.06em;margin-top:6px}
.exline.open .hintx{display:none}
.verdict{font-size:62px;font-weight:800;color:var(--gold2);letter-spacing:-.03em;line-height:1}
</style>

      + '<div class="exlist" id="exl' + i + '"></div>'
      + '<button class="btn small" id="exb' + i + '" style="margin:0">Un exemple</button>';
    box.appendChild(col);
  }
  for (var j = 0; j < NEWTOOLS.length; j++) {
    (function (n) {
      document.getElementById("exb" + n).onclick = function () { nextEx(n); };
    })(j);
  }
  resetEx();
}

function resetEx() {
  for (var i = 0; i < NEWTOOLS.length; i++) {
    shown[i] = 0;
    var l = document.getElementById("exl" + i);
    if (l) l.innerHTML = "";
    var b = document.getElementById("exb" + i);
    if (b) { b.textContent = "Un exemple"; b.style.visibility = "visible"; }
  }
}

function nextEx(i) {
  var data = NEWTOOLS[i];
  if (shown[i] >= data.ex.length) return;
  var pair = data.ex[shown[i]];
  var row = document.createElement("div");
  row.className = "exline";
  row.innerHTML = '<div class="fr2">' + pair[0] + '</div>'
    + '<div class="hintx">clique pour la traduction</div>'
    + '<div class="tr2">' + pair[1] + '</div>';
  row.onclick = function () { this.classList.toggle("open"); };
  document.getElementById("exl" + i).appendChild(row);
  shown[i]++;
  var b = document.getElementById("exb" + i);
  if (shown[i] >= data.ex.length) b.style.visibility = "hidden";
  else b.textContent = "Encore un";
}

/* ---------- TABLEAUX DE SCORE ---------- */
var scores = { A: [], B: [] };
function buildBoard(boardId, key, tallyId) {
  var box = document.getElementById(boardId);
  if (!box) return;
  box.innerHTML = "";
  scores[key] = [];
  for (var i = 0; i < 10; i++) {
    scores[key].push(0);
    var c = document.createElement("div");
    c.className = "cellb";
    c.textContent = i + 1;
    c.setAttribute("data-k", key);
    c.setAttribute("data-i", i);
    c.setAttribute("data-t", tallyId);
    c.onclick = function () {
      var k = this.getAttribute("data-k"), n = parseInt(this.getAttribute("data-i"), 10);
      scores[k][n] = (scores[k][n] + 1) % 3;
      this.className = "cellb" + (scores[k][n] === 1 ? " ok" : (scores[k][n] === 2 ? " no" : ""));
      this.textContent = scores[k][n] === 1 ? "\u2713" : (scores[k][n] === 2 ? "\u2717" : (n + 1));
      tally(k, this.getAttribute("data-t"));
    };
    box.appendChild(c);
  }
  tally(key, tallyId);
}
function countOk(key) {
  var n = 0;
  for (var i = 0; i < scores[key].length; i++) if (scores[key][i] === 1) n++;
  return n;
}
function tally(key, tallyId) {
  var el = document.getElementById(tallyId);
  if (el) el.textContent = countOk(key) + " / 10";
}
buildBoard("boardA", "A", "tallyA");
buildBoard("boardB", "B", "tallyB");

function showVerdict() {
  var a = countOk("A"), b = countOk("B");
  var v = document.getElementById("verd"), t = document.getElementById("verdtxt");
  v.innerHTML = '<span style="font-size:34px;color:#9BA6BC;font-weight:700">DRILL 1</span>&nbsp;&nbsp;' + a
    + '<span style="color:#3A4B6E">&nbsp;/&nbsp;10&nbsp;&nbsp;&nbsp;</span>'
    + '<span style="font-size:34px;color:#9BA6BC;font-weight:700">DRILL 2</span>&nbsp;&nbsp;' + b
    + '<span style="color:#3A4B6E">&nbsp;/&nbsp;10</span>';
  if (a >= 8 && b >= 8) {
    v.style.color = "var(--green)";
    t.innerHTML = "Les deux. Tes mots sont \u00e0 l\u2019\u00e9cran suivant.<br><span style=\"font-size:21px;color:#7F8CA6\">Both drills. You earned them.</span>";
  } else if (a >= 8 || b >= 8) {
    v.style.color = "var(--gold2)";
    t.innerHTML = "Un sur deux. Il en faut deux — on remet \u00e7a la semaine prochaine.<br><span style=\"font-size:21px;color:#7F8CA6\">One out of two. It takes both. Same challenge next week.</span>";
  } else {
    v.style.color = "var(--gold2)";
    t.innerHTML = "Pas encore. On garde les quatre, et on remet \u00e7a la semaine prochaine.<br><span style=\"font-size:21px;color:#7F8CA6\">Not yet. Same four, same challenge next week.</span>";
  }
}


function go(n) {
  if (n < 0 || n >= slides.length) return;
  stopAll();
  slides[cur].classList.remove("on");
  dots[cur].classList.remove("on");
  cur = n;
  slides[cur].classList.add("on");
  dots[cur].classList.add("on");
}
go(0);

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
});

/* ---------- TIMERS ---------- */
function stopAll() {
  for (var k in ivT) { clearInterval(ivT[k]); }
  resetEx();
  stopQ(); clearInterval(ivP); clearTimeout(toP);
  var p = document.getElementById("tP"); if (p) { p.className = "timer"; p.textContent = "—"; }
}

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}

var qList = [], qi = 0;
function runQ() { clearInterval(ivQ); qList = shuffle(POOL); qi = 0; nextQ(); }
function nextQ() {
  var box = document.getElementById("qb"), bar = document.getElementById("qbar"), c = document.getElementById("qc");
  if (qi >= qList.length) { box.textContent = "Terminé !"; c.textContent = "10 / 10"; bar.style.width = "0%"; clearInterval(ivQ); return; }
  box.textContent = qList[qi];
  box.style.animation = "none"; void box.offsetWidth; box.style.animation = "in .35s";
  c.textContent = "QUESTION " + (qi + 1) + " / 10  ·  JE POSE LA QUESTION";
  bar.style.width = "100%";
  clearInterval(ivQ);
  var lead = 50;
  ivQ = setInterval(function () {
    lead--;
    if (lead > 0) return;
    clearInterval(ivQ);
    c.textContent = "QUESTION " + (qi + 1) + " / 10  ·  À TOI";
    var t = 50;
    ivQ = setInterval(function () {
      t--;
      bar.style.width = (t / 50 * 100) + "%";
      if (t <= 0) { clearInterval(ivQ); qi++; nextQ(); }
    }, 100);
  }, 100);
}
function stopQ() {
  clearInterval(ivQ);
  var box = document.getElementById("qb"), bar = document.getElementById("qbar"), c = document.getElementById("qc");
  if (box) { box.textContent = "Prête ?"; bar.style.width = "0%"; c.textContent = "10 QUESTIONS · 5 SECONDES POUR RÉPONDRE"; }
}

function spin(elId, arr, done) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.classList.add("roll");
  var n = 0;
  var s = setInterval(function () {
    el.textContent = arr[Math.floor(Math.random() * arr.length)];
    n++;
    if (n > 12) { clearInterval(s); el.classList.remove("roll"); if (done) done(); }
  }, 70);
}

function spinDrill() {
  spin("slotP", PHRASES);
  spin("slotT", TOOLS.map(function (x) { return x[0]; }));
}

/* pause autorisée : 5 s pour poser la question, 2 s de silence, 10 s pour une seule phrase */
function phaseP(el, label, n, done) {
  el.className = "timer wait";
  el.textContent = label + " " + n;
  ivP = setInterval(function () {
    n--;
    if (n > 0) { el.textContent = label + " " + n; return; }
    clearInterval(ivP);
    done();
  }, 1000);
}

function runPause() {
  clearInterval(ivP); clearTimeout(toP);
  var el = document.getElementById("tP");
  el.className = "timer wait"; el.textContent = "…";
  spin("slotQ", PAUSEQ, function () {
    phaseP(el, "écoute", 5, function () {
      phaseP(el, "silence", 2, function () {
        var t = 10;
        el.className = "timer run"; el.textContent = t;
        ivP = setInterval(function () {
          t--;
          el.textContent = t > 0 ? t : "!";
          if (t <= 3 && t > 0) el.className = "timer warn";
          if (t <= 0) { clearInterval(ivP); el.className = "timer end"; }
        }, 1000);
      });
    });
  });
}
</script>
