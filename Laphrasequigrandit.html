<meta charset="utf-8">
<title>Katinka — Séance 16 — La phrase qui grandit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#14213D; --navy2:#1B2A4A; --gold:#C9A961; --gold2:#E3C782;
  --ink:#F4F1EA; --dim:#9BA6BC; --green:#4ECDA4; --red:#FF6B6B; --plum:#B98CD8;
}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,#1E3157 0%,var(--navy) 55%,#0D1729 100%);
  color:var(--ink); font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;
  overflow:hidden;
}
#stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:66px 56px 112px}
.screen{display:none;width:100%;max-width:1180px;text-align:center}
.screen.on{display:block;animation:in .5s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.kicker{font-size:19px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:22px;font-weight:700}
.tag{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);font-weight:700;margin-bottom:16px}
h1{font-size:70px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:50px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
.sub{font-size:27px;color:var(--dim);margin-top:20px;line-height:1.45}
.en{font-size:21px;color:#7F8CA6;font-style:italic;margin-top:14px}
.gold{color:var(--gold2)}

#logo{position:fixed;top:20px;left:26px;height:48px;opacity:.95;z-index:9;background:#fff;padding:5px 9px;border-radius:8px}
#nav{position:fixed;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;z-index:9}
.dot{width:9px;height:9px;border-radius:50%;background:#3A4B6E;transition:.3s;cursor:pointer}
.dot.on{background:var(--gold);transform:scale(1.5)}
#hint{position:fixed;bottom:52px;left:0;right:0;text-align:center;font-size:15px;color:#5E6C88;letter-spacing:.1em}

.btn{display:inline-block;margin:10px 8px;padding:16px 34px;border-radius:16px;border:2px solid var(--gold);
  background:transparent;color:var(--gold2);font-size:23px;font-weight:700;cursor:pointer;transition:.22s;font-family:inherit}
.btn:hover{background:var(--gold);color:var(--navy);transform:translateY(-3px)}
.btn.solid{background:var(--gold);color:var(--navy)}
.btn.solid:hover{background:var(--gold2)}
.btn.small{font-size:19px;padding:12px 24px;margin:6px 5px}

.timer{font-size:120px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.timer.run{color:var(--green)}
.timer.warn{color:var(--gold2)}
.timer.end{color:var(--red);animation:shake .5s}
.timer.wait{color:#5E6C88}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-11px)}75%{transform:translateX(11px)}}
.ring{width:100%;height:12px;background:#22345A;border-radius:99px;overflow:hidden;margin:24px auto 0;max-width:760px}
.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:100%;transition:width .25s linear}

.rule{background:rgba(255,107,107,.1);border:2px solid rgba(255,107,107,.45);border-radius:20px;
  padding:24px 28px;margin-top:16px;text-align:left}
.rule .h{font-size:29px;font-weight:800;color:var(--red);margin-bottom:9px}
.rule .b{font-size:21px;color:var(--ink);line-height:1.45}
.rule.ok{background:rgba(78,205,164,.1);border-color:rgba(78,205,164,.45)}
.rule.ok .h{color:var(--green)}

.pill{display:inline-block;padding:11px 24px;border-radius:99px;background:rgba(201,169,97,.16);
  border:2px solid rgba(201,169,97,.4);font-size:24px;font-weight:700;color:var(--gold2);margin:7px}

.qbox{font-size:50px;font-weight:800;line-height:1.2;min-height:125px;display:flex;align-items:center;justify-content:center}
.count{font-size:20px;color:var(--dim);letter-spacing:.2em;margin-bottom:20px}
.slot{font-size:50px;font-weight:800;color:var(--gold2);min-height:72px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.slot.roll{animation:roll .09s linear infinite}
@keyframes roll{0%{opacity:.35;transform:translateY(-8px)}100%{opacity:1;transform:none}}

.stat{display:flex;align-items:center;justify-content:space-between;gap:22px;
  background:rgba(255,255,255,.05);border-radius:18px;padding:20px 28px;margin-top:13px;text-align:left}
.stat .lab{font-size:24px;color:var(--ink)}
.stat .val{font-size:46px;font-weight:800;white-space:nowrap}
.stat.good{border-left:6px solid var(--green)}
.stat.good .val{color:var(--green)}
.stat.gold{border-left:6px solid var(--gold)}
.stat.gold .val{color:var(--gold2)}
.stat.grey{border-left:6px solid #3A4B6E}
.stat.grey .val{color:#5E6C88}

/* --- drill la phrase qui grandit --- */
.base{background:rgba(255,255,255,.06);border:2px solid rgba(201,169,97,.3);border-radius:20px;
  padding:22px 28px;margin-top:14px;font-size:38px;font-weight:800;color:var(--ink);line-height:1.25;min-height:96px;
  display:flex;align-items:center;justify-content:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.step{background:rgba(255,255,255,.04);border:2px dashed #3A4B6E;border-radius:18px;padding:20px 14px;
  min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.3s;opacity:.45}
.step.on{opacity:1;border-style:solid;border-color:var(--gold);background:rgba(201,169,97,.14);
  animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
.step .w{font-size:40px;font-weight:800;color:var(--gold2);line-height:1.1}
.step .d{font-size:18px;color:var(--dim);margin-top:10px;line-height:1.35}
.grow{font-size:22px;color:#7F8CA6;letter-spacing:.14em;margin-top:16px}
.grow b{color:var(--gold2);font-size:28px}

.board{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;flex-wrap:wrap}
.cellb{width:46px;height:46px;border-radius:11px;border:2px solid #3A4B6E;background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;cursor:pointer;transition:.18s;color:#5E6C88}
.cellb:hover{border-color:var(--gold)}
.cellb.ok{border-color:var(--green);background:rgba(78,205,164,.18);color:var(--green)}
.cellb.no{border-color:var(--red);background:rgba(255,107,107,.15);color:var(--red)}
.tally{font-size:27px;font-weight:800;color:var(--gold2);margin-top:8px;font-variant-numeric:tabular-nums}
.mini{font-size:15px;color:#5E6C88;margin-top:5px;letter-spacing:.05em}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.card2{background:rgba(255,255,255,.05);border:2px solid rgba(201,169,97,.3);border-radius:20px;padding:22px 24px;text-align:left}
.card2 .t{font-size:34px;font-weight:800;color:var(--gold2);margin-bottom:12px}
.card2 .p{font-size:21px;color:var(--ink);line-height:1.4}
.card2 .e{font-size:19px;color:#8D9AB4;font-style:italic;margin-top:12px;line-height:1.4}
</style>

/* ---------- BUILD ---------- */
var stage = document.getElementById("stage");
var nav = document.getElementById("nav");
for (var i = 0; i < SCREENS.length; i++) {
  var dv = document.createElement("div");
  dv.className = "screen";
  dv.innerHTML = SCREENS[i];

var slides = document.querySelectorAll(".screen");
var dots = document.querySelectorAll(".dot");
var cur = 0;

/* ---------- TABLEAUX DE SCORE ---------- */
var scores = { A: [], B: [] };
function buildBoard(boardId, key, tallyId, n) {
  var box = document.getElementById(boardId);
  if (!box) return;
  box.innerHTML = "";
  scores[key] = [];
  for (var i = 0; i < n; i++) {
    scores[key].push(0);
    var c = document.createElement("div");
    c.className = "cellb";
    c.textContent = i + 1;
    c.setAttribute("data-k", key);
    c.setAttribute("data-i", i);
    c.setAttribute("data-t", tallyId);
    c.setAttribute("data-n", n);
    c.onclick = function () {
      var k = this.getAttribute("data-k"), m = parseInt(this.getAttribute("data-i"), 10);
      scores[k][m] = (scores[k][m] + 1) % 3;
      this.className = "cellb" + (scores[k][m] === 1 ? " ok" : (scores[k][m] === 2 ? " no" : ""));
      this.textContent = scores[k][m] === 1 ? "✓" : (scores[k][m] === 2 ? "✗" : (m + 1));
      tally(k, this.getAttribute("data-t"), this.getAttribute("data-n"));
    };
    box.appendChild(c);
  }
  tally(key, tallyId, n);
}
function countOk(key) {
  var n = 0;
  for (var i = 0; i < scores[key].length; i++) if (scores[key][i] === 1) n++;
  return n;
}
function tally(key, tallyId, n) {
  var el = document.getElementById(tallyId);
  if (el) el.textContent = countOk(key) + " / " + n;
}
buildBoard("boardA", "A", "tallyA", 8);
buildBoard("boardB", "B", "tallyB", 10);

function go(n) {
  if (n < 0 || n >= slides.length) return;
  stopAll();
  slides[cur].classList.remove("on");
  dots[cur].classList.remove("on");
  cur = n;
  slides[cur].classList.add("on");
  dots[cur].classList.add("on");
}
go(0);

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
});

/* ---------- TIMERS ---------- */
function fmt(s) { var m = Math.floor(s / 60); var r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

function stopAll() {
  for (var k in ivT) { clearInterval(ivT[k]); }
  resetT("tW", "bW", 60); resetT("tM", "bM", 90);
  stopQ(); clearInterval(ivP);
  var p = document.getElementById("tP"); if (p) { p.className = "timer"; p.textContent = "—"; }
}

function runT(elId, barId, total) {
  clearInterval(ivT[elId]);
  var t = total, el = document.getElementById(elId), bar = document.getElementById(barId);
  el.className = "timer run"; el.textContent = fmt(t); bar.style.width = "100%";
  ivT[elId] = setInterval(function () {
    t--;
    el.textContent = fmt(t < 0 ? 0 : t);
    bar.style.width = (t / total * 100) + "%";
    if (t <= 15 && t > 0) el.className = "timer warn";
    if (t <= 0) { clearInterval(ivT[elId]); el.className = "timer end"; el.textContent = "STOP"; }
  }, 1000);
}
function resetT(elId, barId, total) {
  clearInterval(ivT[elId]);
  var el = document.getElementById(elId), bar = document.getElementById(barId);
  if (el) { el.className = "timer"; el.textContent = fmt(total); bar.style.width = "100%"; }
}

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}

/* ---------- TIR RAPIDE (pool de septembre) ---------- */
var qList = [], qi = 0;
function runQ() { clearInterval(ivQ); qList = shuffle(POOL); qi = 0; nextQ(); }
function nextQ() {
  var box = document.getElementById("qb"), bar = document.getElementById("qbar"), c = document.getElementById("qc");
  if (qi >= qList.length) { box.textContent = "Terminé !"; c.textContent = "10 / 10"; bar.style.width = "0%"; clearInterval(ivQ); return; }
  box.textContent = qList[qi];
  box.style.animation = "none"; void box.offsetWidth; box.style.animation = "in .35s";
  c.textContent = "QUESTION " + (qi + 1) + " / 10  ·  JE POSE LA QUESTION";
  bar.style.width = "100%";
  clearInterval(ivQ);
  var lead = 50;
  ivQ = setInterval(function () {
    lead--;
    if (lead > 0) return;
    clearInterval(ivQ);
    c.textContent = "QUESTION " + (qi + 1) + " / 10  ·  À TOI";
    var t = 50;
    ivQ = setInterval(function () {
      t--;
      bar.style.width = (t / 50 * 100) + "%";
      if (t <= 0) { clearInterval(ivQ); qi++; nextQ(); }
    }, 100);
  }, 100);
}
function stopQ() {
  clearInterval(ivQ);
  var box = document.getElementById("qb"), bar = document.getElementById("qbar"), c = document.getElementById("qc");
  if (box) { box.textContent = "Prête ?"; bar.style.width = "0%"; c.textContent = "10 QUESTIONS · 5 SECONDES POUR RÉPONDRE"; }
}

/* ---------- DRILL : LA PHRASE QUI GRANDIT ---------- */
var curBase = null;
function spin(elId, arr, done) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.classList.add("roll");
  var n = 0;
  var s = setInterval(function () {
    el.textContent = arr[Math.floor(Math.random() * arr.length)];
    n++;
    if (n > 12) { clearInterval(s); el.classList.remove("roll"); if (done) done(); }
  }, 70);
}
function resetSteps() {
  shownStep = 0;
  for (var i = 0; i < 3; i++) {
    var s = document.getElementById("st" + i);
    if (s) s.className = "step";
  }
}
function newBase() {
  resetSteps();
  var el = document.getElementById("baseS");
  var names = BASES.map(function (x) { return x[0]; });
  el.classList.add("roll");
  var n = 0;
  var s = setInterval(function () {
    var pick = BASES[Math.floor(Math.random() * BASES.length)];
    el.textContent = pick[0];
    curBase = pick;
    n++;
    if (n > 12) {
      clearInterval(s);
      el.classList.remove("roll");
      var g = document.getElementById("growL");
      if (g) g.innerHTML = curBase[1] + ' mots <b>&rarr;</b> ' + (curBase[1] + 13) + ' mots';
    }
  }, 70);
}
function nextStep() {
  if (!curBase) { newBase(); return; }
  if (shownStep >= 3) return;
  var s = document.getElementById("st" + shownStep);
  if (s) s.className = "step on";
  shownStep++;
}

/* ---------- DRILL : UNE QUESTION, UNE PHRASE ---------- */
function phaseP(el, label, n, done) {
  el.className = "timer wait";
  el.textContent = label + " " + n;
  ivP = setInterval(function () {
    n--;
    if (n > 0) { el.textContent = label + " " + n; return; }
    clearInterval(ivP);
    done();
  }, 1000);
}
function runPause() {
  clearInterval(ivP);
  var el = document.getElementById("tP");
  el.className = "timer wait"; el.textContent = "…";
  spin("slotQ", PAUSEQ, function () {
    phaseP(el, "écoute", 5, function () {
      phaseP(el, "silence", 2, function () {
        var t = 12;
        el.className = "timer run"; el.textContent = t;
        ivP = setInterval(function () {
          t--;
          el.textContent = t > 0 ? t : "!";
          if (t <= 3 && t > 0) el.className = "timer warn";
          if (t <= 0) { clearInterval(ivP); el.className = "timer end"; }
        }, 1000);
      });
    });
  });
}
